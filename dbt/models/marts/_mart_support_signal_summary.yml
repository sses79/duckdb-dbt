version: 2

models:
  - name: mart_support_signal_summary
    description: >
      One row per trust, school, survey period and question code summarising
      how many eligible pupils submitted an adverse answer at school level.
      A signal describes an aggregate survey pattern and is never a diagnosis,
      a safeguarding determination or a recommendation about an individual.
    columns:
      - name: trust_id
        tests:
          - not_null
      - name: school_id
        tests:
          - not_null
      - name: survey_period
        tests:
          - not_null
      - name: question_code
        tests:
          - not_null
      - name: rule_version
        tests:
          - not_null

