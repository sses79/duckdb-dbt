version: 2

models:
  - name: mart_question_response_distribution
    description: >
      One row per trust, school, survey period, question and answer label giving
      the count and rate of each answer label actually given among answered
      responses. Whole questions with fewer than ten answered responses are
      suppressed: their response counts and rates are null while the answered
      count is kept.
    columns:
      - name: trust_id
        tests:
          - not_null
      - name: school_id
        tests:
          - not_null
      - name: school_classification
        tests:
          - not_null
      - name: survey_period
        tests:
          - not_null
      - name: question_code
        tests:
          - not_null
      - name: indicator_label
        tests:
          - not_null
      - name: category_code
        tests:
          - not_null
      - name: category_label
        tests:
          - not_null
      - name: answer_label
        tests:
          - not_null
      - name: answer_order
        tests:
          - not_null
      - name: answered_response_count
        tests:
          - not_null
      - name: is_suppressed
        tests:
          - not_null
      - name: response_count
      - name: response_rate

