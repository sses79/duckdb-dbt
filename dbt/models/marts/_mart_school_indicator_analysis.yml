version: 2

models:
  - name: mart_school_indicator_analysis
    description: >
      One row per trust, school, survey period and catalogue question, with the
      school's submission coverage, suppression, adverse response rate against a
      trust benchmark, and movement compared with the previous survey period.
    columns:
      - name: trust_id
        tests:
          - not_null
      - name: school_id
        tests:
          - not_null
      - name: survey_period
        tests:
          - not_null
      - name: question_code
        tests:
          - not_null

unit_tests:
  - name: below_ten_answered_is_suppressed
    model: mart_school_indicator_analysis
    given:
      - input: ref('fct_wellbeing_response')
        rows:
          - document_id: doc_1
            trust_id: trust_north
            school_id: school_1
            school_classification: primary
            survey_period: 2023-spring
            question_code: feel_sad
            is_answered: true
            is_adverse: true
