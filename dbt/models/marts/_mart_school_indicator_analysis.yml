          - question_code: feel_sad
            indicator_label: Most days or every day sad or upset
            category_code: emotional_wellbeing
            category_label: Emotional wellbeing
            direction: higher_is_worse
            interpretation_note: Surveys where many pupils report feeling sad or upset most days or every day tend to show lower overall emotional wellbeing.
