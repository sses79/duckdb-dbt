version: 2

models:
  - name: mart_school_category_analysis
    description: >
      One row per trust, school, survey period and indicator category, summarising
      eligible and answering submissions, answered and missing question responses,
      and adverse response rates against a trust-level benchmark. Rates are
      suppressed when fewer than ten documents answer, and movement versus the
      previous period is given in percentage points.
    columns:
      - name: trust_id
        tests:
          - not_null
      - name: school_id
        tests:
          - not_null
      - name: survey_period
        tests:
          - not_null
      - name: category_code
        tests:
          - not_null

unit_tests:
  - name: suppresses_rates_when_fewer_than_ten_answering_submissions
    model: mart_school_category_analysis
    given:
      - input: ref('fct_wellbeing_response')
        rows:
          - document_id: doc_1
            trust_id: trust_north
            school_id: school_alpha
            school_classification: State
            survey_period: '2018-autumn'
            question_code: feel_sad
            is_answered: true
            is_adverse: true
