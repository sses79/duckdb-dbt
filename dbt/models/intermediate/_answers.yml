version: 2

models:
  - name: int_wellbeing_answers
    columns:
      - name: document_id
        tests:
          - not_null
      - name: question_code
        tests:
          - not_null

unit_tests:
  - name: answers_one_row_per_question_with_blanks
    model: int_wellbeing_answers
    given:
      - input: ref('int_wellbeing_submission_current')
        rows:
          - document_id: doc_1
            event_id: evt_1
            trust_id: trust_north
            answers: '{"feel_sad": "Rarely", "feel_lonely": null}'
      - input: ref('indicator_answer_catalog')
        rows:
          - question_code: feel_sad
            answer_label: Never
          - question_code: feel_sad
            answer_label: Rarely
          - question_code: feel_lonely
            answer_label: Never
          - question_code: feel_happy
            answer_label: Never
    expect:
      rows:
        - document_id: doc_1
          question_code: feel_sad
          answer_label: Rarely
        - document_id: doc_1
          question_code: feel_lonely
          answer_label: null
        - document_id: doc_1
          question_code: feel_happy
          answer_label: null
