      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: table
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  school_wellbeing_demo:
    +schema: core
