version: 2

seeds:
  - name: indicator_answer_catalog
    config:
      column_types:
        question_code: varchar
        question_label: varchar
        category: varchar
        answer_label: varchar
        answer_order: integer
        is_adverse: boolean
    columns:
      - name: question_code
        tests:
          - not_null
      - name: question_label
        tests:
          - not_null
      - name: category
        tests:
          - not_null
          - accepted_values:
              values:
                - emotional_wellbeing
                - relationships
                - school_connection
                - safety
                - healthy_lifestyle
      - name: answer_label
        tests:
          - not_null
      - name: answer_order
        tests:
          - not_null
      - name: is_adverse
        tests:
          - not_null
  - name: indicator_catalog
    config:
      column_types:
        question_code: varchar
        indicator_label: varchar
        category_code: varchar
        category_label: varchar
        direction: varchar
        interpretation_note: varchar
    columns:
      - name: question_code
        tests:
          - not_null
      - name: indicator_label
        tests:
          - not_null
      - name: category_code
        tests:
          - not_null
      - name: category_label
        tests:
          - not_null
      - name: direction
        tests:
          - not_null
      - name: interpretation_note
        tests:
          - not_null
  - name: expected_mutation_batches
    config:
      column_types:
        batch_id: varchar
        expected_row_count: integer
    columns:
      - name: batch_id
        tests:
          - not_null
      - name: expected_row_count
        tests:
          - not_null
