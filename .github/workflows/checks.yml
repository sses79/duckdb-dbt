name: checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      # The same argv the factory contract declares, so CI and the factory's own
      # validation cannot disagree about what "the checks pass" means.
      - name: typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: test
        run: node_modules/.bin/vitest run --dir src --maxWorkers=1

      - name: pipeline
        run: node scripts/verify-local.ts

      - name: dashboard-test
        run: node_modules/.bin/vitest run --dir apps/dashboard --maxWorkers=1 --passWithNoTests

      - name: dashboard-build
        run: node_modules/.bin/next build apps/dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
